services:
  kombain:
    build: .
    image: yt-kombain:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:8000:8000"
    # Временные файлы скачивания — в отдельном томе с ограничением размера
    tmpfs:
      - /tmp/yt-kombain:size=4g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

# /etc/nginx/sites-available/yt-kombain
# Обратный прокси перед uvicorn. HTTPS-сертификат — через certbot: certbot --nginx -d example.com

limit_req_zone $binary_remote_addr zone=kombain_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 16k;          # API принимает только короткий JSON
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 800;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Статика напрямую с диска (путь к папке app/static)
    location /static/ {
        alias /srv/kombain/app/static/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public" always;
        if ($args ~ "v=") { expires 1y; }
    }

    # API без журналов доступа: ссылки пользователей не должны оседать в логах
    location /api/ {
        access_log off;
        limit_req zone=kombain_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 90s;
    }

    # Редактор Shorts: загрузка музыки и титров, отдача исходника с перемоткой
    location /api/editor/ {
        access_log off;
        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Отдача готовых файлов: без буферизации и с долгим таймаутом
    location /api/download/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }
}
